  try{

    const k = JSON.parse(localStorage.getItem("kieli")); if(k==="en") document.documentElement.lang = "en";
  }catch(e){}
</script>
<style>
/* Ulkoasu: "Editorial Grid / Magazine" – sanomalehden etusivu.
   Kirjasimet Libre Bodoni (otsikot) + Public Sans (teksti). Ei varjoja eikä pyöristyksiä, viivat erottavat osiot. */
:root{
  --bg:#f4f1e8; --paper:#fbf9f3; --ink:#1b3326; --muted:#52615a; --accent:#a3264d; --accent-ink:#fbf9f3;
  --line:#d5d0c2; --soft:#e9e5d8; --rule:#1b3326;
  --ok:#2e6b3f; --err:#b3261e;
  --tahti:rgba(27,51,38,.28); --viiva:rgba(163,38,77,.35);
  --serif:"Libre Bodoni",Didot,"Bodoni 72",Georgia,serif;
  --sans:"Public Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a15; --paper:#16231c; --ink:#e6eee8; --muted:#a3b3aa; --accent:#f28fb0; --accent-ink:#101a15;
    --line:#2a3b32; --soft:#1d2c24; --rule:#e6eee8;
    --ok:#7fd49a; --err:#ff8a7a;
    --tahti:rgba(230,238,232,.5); --viiva:rgba(242,143,176,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a15; --paper:#16231c; --ink:#e6eee8; --muted:#a3b3aa; --accent:#f28fb0; --accent-ink:#101a15;
    --line:#2a3b32; --soft:#1d2c24; --rule:#e6eee8;
    --ok:#7fd49a; --err:#ff8a7a;
    --tahti:rgba(230,238,232,.5); --viiva:rgba(242,143,176,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);transition:background .2s,color .2s}
#tahdet{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 24px 32px}
h1,h2,.big{font-family:var(--serif)}
h1,h2{margin:0}
a{color:var(--accent);text-underline-offset:2px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{cursor:pointer}
.ui{font-family:var(--sans)}

/* Mastheadi: iso nimi keskellä, päiväys ja säätimet viivojen välissä */
.head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:8px;border-bottom:4px double var(--rule)}
h1{flex:1 1 100%;text-align:center;font-size:clamp(2.4rem,5vw,3.6rem);font-weight:700;line-height:1;letter-spacing:-.01em;padding:0 0 8px;margin-bottom:6px;border-bottom:1px solid var(--rule)}
.date{flex:1 1 auto;margin:0;color:var(--ink);font:600 .78rem var(--sans);text-transform:uppercase;letter-spacing:.12em}
.iconbtn{font:600 .78rem var(--sans);text-transform:uppercase;letter-spacing:.08em;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:0;padding:8px 12px;min-height:40px;transition:background .15s,color .15s}
.iconbtn:hover{background:var(--ink);color:var(--paper)}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.kielet{display:inline-flex;border:1px solid var(--rule)}
.kielet button{font:700 .78rem var(--sans);letter-spacing:.08em;border:0;background:transparent;color:var(--muted);padding:8px 12px;min-height:40px}
.kielet button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Aiheet: sisällysluettelo pystyviivoin */
.cards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:16px;border-bottom:1px solid var(--rule)}
@media (max-width:1179px){
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px 18px;padding:0 24px;scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 160px;scroll-snap-align:start}
}
.card{display:flex;gap:10px;align-items:flex-start;text-align:left;background:transparent;color:var(--ink);border:0;border-top:3px solid transparent;border-right:1px solid var(--line);border-radius:0;padding:8px 12px 10px;min-height:66px;font:inherit;transition:background .15s,border-color .15s}
.card:last-child{border-right:0}
.card:hover{background:var(--soft)}
.card[aria-selected="true"]{border-top-color:var(--accent);background:var(--paper)}
.card .txt{min-width:0;flex:1}
.card .lbl{display:block;font:700 .66rem var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .prev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 .98rem/1.25 var(--serif);margin-top:4px;overflow-wrap:anywhere}
.card img{width:42px;height:42px;object-fit:cover;flex:0 0 auto;background:var(--soft);filter:grayscale(.15)}
.card .prev.wait{color:var(--muted);font-style:italic;font-weight:400}

/* Pääjuttu ja ruudukon palstat */
.panel,.tile{background:var(--paper);border-top:4px solid var(--rule);overflow:hidden}
.ptop{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line);color:var(--ink)}
.ptop h2{font-size:1.05rem;font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.1em;flex:1 1 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font:700 .66rem var(--sans);text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;color:var(--accent);border:1px solid var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .78rem var(--sans);text-transform:uppercase;letter-spacing:.07em;border:1px solid var(--rule);border-radius:0;padding:9px 14px;min-height:40px;background:transparent;color:var(--ink);transition:background .15s,color .15s}
.btn:hover{background:var(--soft)}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.main:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:wait}
.out{padding:22px 28px 26px;min-height:220px}
.hint{color:var(--muted);font-style:italic;margin:0}
.err{color:var(--err);margin:0 0 12px}
.big{font-size:clamp(2.1rem,5.5vw,3.2rem);font-weight:700;line-height:1.05;margin:0 0 14px;letter-spacing:-.01em;overflow-wrap:anywhere}
.out p{margin:0 0 14px;max-width:68ch}
/* anfangi eli iso alkukirjain jutun ensimmäiseen kappaleeseen */
.out > .big + p:not(.tiivis):not(.src):not(.wclass)::first-letter,
.out > .chips + p:not(.tiivis)::first-letter{float:left;font:700 3.6em/.8 var(--serif);padding:6px 8px 0 0;color:var(--accent)}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .7rem var(--sans);text-transform:uppercase;letter-spacing:.1em;background:transparent;color:var(--ink);border:1px solid var(--rule);padding:3px 9px}
.chip img{height:.95em;width:auto;box-shadow:0 0 0 1px var(--line)}

/* Kuvat ja kartta vasemmalla, teksti oikealla, palstaviiva välissä */
.out.has-img{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 0;align-items:start}
.out.has-img>.media{grid-column:1;grid-row:1/span 30;padding-right:28px;margin-right:28px;border-right:1px solid var(--line)}
.out.has-img>:not(.media){grid-column:2}
.media{display:grid;gap:16px;margin-bottom:14px}
.media figure{margin:0}
.stage{position:relative;overflow:hidden;background:var(--soft)}
.stage img{display:block;width:100%;height:min(44vh,380px);object-fit:contain}
.media:has(.kartta) .stage img{height:min(24vh,250px)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:0;background:rgba(27,51,38,.72);color:#fff;font:700 1.3rem/1 system-ui,sans-serif;display:grid;place-items:center}
.nav:hover{background:var(--accent)}
.nav.prev{left:0}
.nav.next{right:0}
.count{position:absolute;right:0;bottom:0;background:rgba(27,51,38,.78);color:#fff;font:600 .72rem var(--sans);letter-spacing:.06em;padding:4px 9px}
figcaption{font:italic .76rem/1.35 var(--sans);color:var(--muted);margin-top:6px}
figcaption a{color:inherit}
.kartta iframe{display:block;width:100%;height:min(24vh,230px);border:1px solid var(--line);background:var(--soft);filter:grayscale(.35)}

/* Sana */
.defs{margin:0 0 14px;padding-left:1.4em}
.defs li{margin-bottom:8px}
.defs li::marker{font-family:var(--serif);font-weight:700;color:var(--accent)}
.defs .esim{display:block;color:var(--muted);font-style:italic;font-size:.93rem}
.wclass{font:700 .72rem var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:0 0 6px}

/* Tietotaulukko */
.facts{display:grid;grid-template-columns:max-content 1fr;gap:0 16px;margin:6px 0 14px;font-size:.9rem;border-top:2px solid var(--rule)}
.facts dt,.facts dd{padding:5px 0;border-bottom:1px solid var(--line)}
.facts dt{font:700 .7rem var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:8px}
.facts dd{margin:0;overflow-wrap:anywhere}

/* Mietelause ja vitsi: nostolainaus */
.quote{position:relative;margin:0 0 16px;padding:18px 0 14px;border-top:2px solid var(--rule);border-bottom:1px solid var(--rule);font:italic 500 clamp(1.45rem,3.8vw,2.1rem)/1.35 var(--serif);max-width:40ch}
.who{font:700 .8rem var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:0 0 16px}
.joke{white-space:pre-line;font:400 clamp(1.15rem,3vw,1.4rem)/1.55 var(--serif);max-width:58ch;margin:0 0 16px;padding:4px 0 4px 20px;border-left:3px solid var(--accent)}

/* Visa */
.q{font:600 1.3rem var(--serif);margin:0 0 14px}
.opts{display:grid;gap:10px;margin:0 0 14px;max-width:760px}
.opt{text-align:left;font:inherit;font-size:1rem;line-height:1.4;padding:12px 14px;border:1px solid var(--rule);border-radius:0;background:var(--paper);color:var(--ink);transition:background .15s}
.opt:hover:not(:disabled){background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.wrong{border:2px solid var(--err);background:color-mix(in srgb,var(--err) 10%,var(--paper))}
.score{font:700 .78rem var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.inline{font:600 .78rem var(--sans);text-transform:uppercase;letter-spacing:.07em;border:0;border-radius:0;padding:10px 16px;min-height:40px;background:var(--ink);color:var(--paper)}
.inline:hover{background:var(--accent);color:var(--accent-ink)}

/* Suosikit */
.favs{list-style:none;margin:0;padding:0;display:grid;border-top:2px solid var(--rule)}
.favs li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:6px 4px}
.favs .open{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:6px 0;display:flex;gap:12px;align-items:baseline}
.favs .open:hover .t{text-decoration:underline}
.favs .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-weight:600}
.favs .del{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:6px 10px;min-width:44px;min-height:40px}
.favs .del:hover{color:var(--err);background:var(--soft)}

/* Ruudukkonäkymä */
.rasetukset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.rasetukset .ohje{font:700 .72rem var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:4px}
.valinta{font:600 .78rem var(--sans);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:0;padding:6px 12px;min-height:36px;transition:background .15s,border-color .15s}
.valinta:hover:not(:disabled){border-color:var(--rule)}
.valinta[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.valinta:disabled{opacity:.4;cursor:not-allowed}
.paivita-kaikki{margin-left:auto;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.07em}
.paivita-kaikki:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ruudukko{display:grid;gap:22px}
.ruudukko.n1{grid-template-columns:1fr}
.ruudukko.n2,.ruudukko.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.ruudukko.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;min-width:0}
.tile .ptop{padding:8px 14px}
.tile .ptop h2{font-size:.85rem}
.tile .btn{padding:6px 10px;min-height:34px;font-size:.72rem}
.tile .out{padding:16px 16px 18px;min-height:160px;flex:1}
.ruudukko:not(.n1) .stage img{height:220px}
.ruudukko:not(.n1) .big{font-size:1.7rem}
.ruudukko:not(.n1) .quote{font-size:1.3rem}
.ruudukko:not(.n1) .joke{font-size:1.08rem}
.tiivis{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}

/* Sää: sanomalehden sääruutu */
.saa{background:var(--paper);border:1px solid var(--rule);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--line);padding:12px 16px;margin-bottom:18px;font-family:var(--sans);
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.saa-top{display:flex;align-items:center;gap:2px}
.saa-paikka{font:700 .78rem var(--sans);text-transform:uppercase;letter-spacing:.12em;margin-right:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saa-top button{background:none;border:0;color:var(--muted);font-size:.95rem;padding:2px 5px;min-width:32px;min-height:32px}
.saa-top button:hover{background:var(--soft);color:var(--ink)}
#saaPuoli{display:none}
.saa-nyt{display:flex;align-items:center;gap:10px}
.saa-ikoni,.saa-paivat .ik{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal}
.saa-ikoni{font-size:2.2rem;line-height:1}
.saa-temp{font:700 2.2rem/1 var(--serif);letter-spacing:-.02em}
.saa-kuvaus{font-size:.8rem;color:var(--muted);line-height:1.35}
.saa-kuvaus b{color:var(--ink);font-weight:700}
.saa-paivat{display:flex;gap:14px;font-size:.78rem;text-align:center}
.saa-paivat div{display:grid;gap:1px}
.saa-paivat .pv{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:.68rem}
.saa-paivat .ik{font-size:1.75rem;line-height:1.25}
.saa-paivat .mm{white-space:nowrap;font-weight:600}
.saa-paivat .mm span{color:var(--muted);font-weight:400}
.saa-lahde{font-size:.68rem;margin-left:auto}
.saa-lahde a{color:var(--muted)}
@media (min-width:1280px){
  .wrap{max-width:1420px}
  .wrap.saa-vasen{padding-left:268px}
  .wrap.saa-oikea{padding-right:268px}
  .saa{position:absolute;top:22px;width:224px;display:block;padding:14px 16px;margin:0}
  .saa-vasen .saa{left:24px}
  .saa-oikea .saa{right:24px}
  #saaPuoli{display:inline-block}
  .saa-top{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .saa-paikka{flex:1}
  .saa-nyt{margin-bottom:12px}
  .saa-ikoni{font-size:2.6rem}
  .saa-temp{font-size:2.8rem}
  .saa-paivat{justify-content:space-between;gap:4px;border-top:1px solid var(--line);padding-top:10px}
  .saa-lahde{margin-top:10px;text-align:right}
}

/* Kissagif */
.kissa{position:fixed;right:14px;bottom:14px;z-index:5}
.kbox{position:relative;background:var(--paper);border:1px solid var(--rule);padding:6px;--kw:144px}
.kbox img{display:block;width:var(--kw);height:calc(var(--kw)*.76);object-fit:cover;background:var(--soft)}
/* vetokahva vasemmassa yläkulmassa: vedä ulos = isompi, sisään = pienempi */
.kahva{position:absolute;left:-8px;top:-8px;width:24px;height:24px;border:0;padding:0;cursor:nwse-resize;touch-action:none;
  background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 .8rem/1 system-ui,sans-serif}
.kahva:hover{filter:brightness(1.1)}
.kbox{width:calc(var(--kw) + 14px)}
.kbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0 2px;margin-top:4px}
.kbar span{flex:1 1 100%;font:700 .66rem var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbar a{color:inherit}
.kbar button,.knayta{background:none;border:0;color:var(--muted);font-size:.95rem;padding:2px 4px;min-width:26px;min-height:28px}
.kbar button:disabled{opacity:.35;cursor:default}
.kbar button:hover{background:var(--soft);color:var(--ink)}
.knayta{background:var(--paper);border:1px solid var(--rule);font-size:1.4rem;width:48px;height:48px}

/* Alatunniste ja ilmoitus */
.foot{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-top:22px;padding-top:10px;border-top:4px double var(--rule);font-size:.78rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;padding:4px 0}
.toast{position:fixed;left:50%;bottom:22px;z-index:10;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font:600 .85rem var(--sans);letter-spacing:.04em;padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .ruudukko.n3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ruudukko.n3 .tile:first-child{grid-column:1/-1}
}
@media (max-width:760px){

function lyhenna(text,max=650){
  if(!text || text.length<=max) return text||"";
  const cut = text.slice(0,max), i = cut.lastIndexOf(". ");

}

/* Wikiteksti -> luettava teksti (mallineet, linkit, viitteet pois) */
function siistiWiki(t){
  t = t.replace(/<ref[^>]*\/>/gi,"").replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi,"").replace(/<!--[\s\S]*?-->/g,"")
       .replace(/<noinclude>[\s\S]*?<\/noinclude>/gi,"");
  t = t.replace(/\[\[(?:Kuva|File|Tiedosto|Image|Luokka|Category):[^\[\]]*(?:\[\[[^\]]*\]\][^\[\]]*)*\]\]/gi,"");
  t = t.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/\[https?:[^\s\]]+\s*([^\]]*)\]/g,"$1");
  for(let k=0;k<6;k++){
    const ennen = t;
    t = t.replace(/\{\{([^{}]*)\}\}/g,(m,sis)=>{
      const o = sis.split("|").map(x=>x.trim()), n = o[0].toLowerCase();
      const pos = o.slice(1).filter(x=>!/^[\w ]+=/.test(x));
      if(/^formatnum:/.test(n)) return o[0].slice(10);
      if(n.startsWith("#")) return "";
      if(n==="yhteys"||n==="konteksti"||n==="k") return pos.length ? "("+pos.join(", ")+") " : "";
      if(/^(lb|lbl|label|tlb)$/.test(n)){ const v=pos.slice(1).filter(x=>x!=="_"&&x!=="and"&&x!=="or"); return v.length ? "("+v.join(", ")+") " : ""; }
      if(/^(q|qual|qualifier|i|gloss|gl|sense|s)$/.test(n)) return pos.length ? "("+pos.join(", ")+") " : "";
      if(n==="l"||n==="link"||n==="termi"||n==="m"||n==="ll") return pos[1]||pos[0]||"";
      if(n==="convert"||n==="cvt"){
        if(/^(-|–|to|and)$/.test(pos[1]||"")) return pos[0]+"–"+pos[2]+" "+(pos[3]||"");
        return pos[0]+" "+(pos[1]||"");
      }
      if(/^(start date|start date and age|end date|end date and age|birth date|dts|date)$/.test(n)){
        const [y,mo,d] = pos;
        if(d && /^\d+$/.test(d)) return (+d)+"."+(+mo)+"."+y;
        if(mo && /^\d+$/.test(mo)) return (+mo)+"/"+y;
        return y||"";
      }
      if(/^(avyear|av|year|flag|flagcountry|nowrap|small|nobr|ill|abbr|taxfmt|taxlink|vern|w|pedia|n-g|ngd|non-gloss definition|non-gloss|1|cap|smallcaps)$/.test(n)) return pos[0]||"";
      if(n==="lang") return pos[1]||"";
      if(/^(ubl|unbulleted list|plainlist|plain list|flatlist|hlist|bulleted list)$/.test(n)) return pos.join(", ");
      return "";
    });
    if(t===ennen) break;
  }
  t = t.replace(/'{2,}/g,"").replace(/<br\s*\/?>/gi,", ").replace(/<[^>]+>/g,"")
       .replace(/&nbsp;/g," ").replace(/&mdash;/g,"—").replace(/&ndash;/g,"–").replace(/&amp;/g,"&");
  return t.replace(/\(\s*\)/g,"").replace(/\s+/g," ").replace(/\s+([,.;:])/g,"$1")
          .replace(/:,/g,":").replace(/([.!?…]),/g,"$1").replace(/,(\s*,)+/g,",").replace(/^[\s,]+|[\s,]+$/g,"").trim();
}
const htmlTekstiksi = h => { const d=document.createElement("div"); d.innerHTML=h||""; return (d.textContent||"").replace(/\s+/g," ").trim(); };

// Wikimedia antaa pikkukuvat vain vakioleveyksinä (esim. 330, 500, 960). Muut koot epäonnistuvat.
function isompiKuva(src,leveys){
  if(!src || !/\/\d+px-/.test(src)) return src;
  return leveys>=960 || !leveys ? src.replace(/\/\d+px-/,"/960px-") : src;
}
function commonsSivu(src){
  const m = (src||"").match(/\/wikipedia\/commons\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^/?]+)/);
  return m ? "https://commons.wikimedia.org/wiki/File:"+m[1] : null;
}
const IINFO = "&prop=imageinfo&iiprop=url|mime|size|extmetadata&iiurlwidth=960";
const KUVA_POIS = /logo|icon|flag|lippu|map|kartta|locator|location|diagram|symbol|emblem|coat.of.arms|vaakuna|signature|badge|seal|chart|graph|plan\b|drawing|3.?view|silhouette|redirect|commons-|wiktionary|edit-|ambox|\.svg$/i;
function hyvaKuva(p){
  const i = p.imageinfo && p.imageinfo[0]; if(!i) return false;
  const r = i.width/i.height;
  return /^image\/(jpeg|png|webp)/.test(i.mime) && i.width>=400 && i.height>=250 && r<3 && r>0.45 && !KUVA_POIS.test(p.title);
}
function kuvaImageinfosta(p){
  const i = p.imageinfo[0], m = i.extmetadata||{};
  return { src:i.thumburl||i.url, sivu:i.descriptionurl,
           tekija:htmlTekstiksi(m.Artist && m.Artist.value).slice(0,80),
           lisenssi:(m.LicenseShortName && m.LicenseShortName.value)||"" };
}
async function tiedostonKuva(nimi){
  try{ nimi = decodeURIComponent(nimi); }catch(e){}
  const j = await getJSON(API.commons+IINFO+"&titles="+encodeURIComponent("File:"+nimi.replace(/_/g," ")));
  const p = j.query && j.query.pages && j.query.pages[0];
  if(!p || !p.imageinfo) return null;
  const i = p.imageinfo[0];
  if(!/^image\/(jpeg|png|webp|gif)/.test(i.mime) || i.width<200 || i.height<150) return null;
  return kuvaImageinfosta(p);
}
async function artikkelinKuvat(base,otsikko,max){
  try{
    const j = await getJSON(base+"&redirects=1&generator=images&gimlimit=50"+IINFO+"&titles="+encodeURIComponent(otsikko));
    return ((j.query && j.query.pages)||[]).filter(hyvaKuva).map(kuvaImageinfosta).slice(0,max||10);
  }catch(e){ return []; }
}
function kuvaRestista(d){
  if(!d || !d.thumbnail) return null;
  const leveys = d.originalimage && d.originalimage.width;
  return {src:isompiKuva(d.thumbnail.source,leveys), varasrc:d.thumbnail.source,
          sivu:commonsSivu(d.thumbnail.source) || d.content_urls.desktop.page, tekija:"", lisenssi:""};
}
function yhdistaKuvat(listat,max){
  const nahdyt = new Set(), tulos = [];
  const avain = k => { let s=(k.sivu||k.src).split("/").pop().replace(/^File:/,""); try{ s=decodeURIComponent(s); }catch(e){} return s.replace(/_/g," ").toLowerCase(); };
  for(const k of listat.flat()){
    if(!k || !k.src) continue;
    const a = avain(k); if(nahdyt.has(a)) continue;
    nahdyt.add(a); tulos.push(k);
    if(tulos.length>=(max||10)) break;
  }
  return tulos;
}

function jasennaSanaFi(wt){
  const rivit = wt.split("\n");
  const a = rivit.findIndex(r=>/^==\s*Suomi\s*==\s*$/.test(r));
  if(a<0) return null;
  let b = rivit.findIndex((r,n)=>n>a && /^==[^=].*[^=]==\s*$/.test(r)); if(b<0) b=rivit.length;
  const ryhmat=[]; let nyk=null, kuva=null;
  for(const r of rivit.slice(a+1,b)){
    const km = r.match(/\[\[(?:Kuva|File|Tiedosto|Image):([^|\]]+)/i); if(km && !kuva) kuva = km[1].trim();
    const h = r.match(/^===\s*([^=]+?)\s*===\s*$/);
    if(h){ nyk={luokka:h[1].trim(), maar:[], esim:[]}; ryhmat.push(nyk); continue; }
    if(/^====/.test(r)){ nyk=null; continue; }
    if(!nyk) continue;
    if(/^#[^:*#]/.test(r)){
      const s = siistiWiki(r.slice(1));
      if(s.length>1 && nyk.maar.length<6){ nyk.maar.push(s); nyk.esim.push(""); }
    } else if(/^#:/.test(r) && nyk.maar.length && !nyk.esim[nyk.maar.length-1]){
      nyk.esim[nyk.maar.length-1] = siistiWiki(r.replace(/^#:+/,""));
    }
  }
  const tulos = ryhmat.filter(x=>x.maar.length);
  if(!tulos.length) return null;
  if(tulos.every(g=>g.maar.every(m=>/taivutusmuoto|monikko|yksikön|genetiivi|partitiivi/i.test(m) && m.length<60))) return null;
  return {ryhmat:tulos.slice(0,3), kuva};
}
const SANALUOKKA_EN = /^(Noun|Verb|Adjective|Adverb|Pronoun|Preposition|Conjunction|Interjection|Proper noun|Phrase|Idiom|Prepositional phrase|Numeral|Determiner|Particle|Proverb)$/;
function jasennaSanaEn(wt){
  const rivit = wt.split("\n");
  const a = rivit.findIndex(r=>/^==\s*English\s*==\s*$/.test(r));
  if(a<0) return null;
  let b = rivit.findIndex((r,n)=>n>a && /^==[^=].*[^=]==\s*$/.test(r)); if(b<0) b=rivit.length;
  const ryhmat=[]; let nyk=null, kuva=null;
  for(const r of rivit.slice(a+1,b)){
    const km = r.match(/\[\[(?:File|Image):([^|\]]+)/i); if(km && !kuva) kuva = km[1].trim();
    const h = r.match(/^(={3,5})\s*([^=]+?)\s*\1\s*$/);
    if(h){
      if(SANALUOKKA_EN.test(h[2])){ nyk={luokka:h[2], maar:[], esim:[]}; ryhmat.push(nyk); } else nyk=null;
      continue;
    }
    if(!nyk) continue;
    if(/^#[^:*#]/.test(r)){
      const s = siistiWiki(r.slice(1));
      if(s.length>1 && nyk.maar.length<5){ nyk.maar.push(s); nyk.esim.push(""); }
    } else if(/^#:/.test(r) && nyk.maar.length && !nyk.esim[nyk.maar.length-1]){
      const ux = r.match(/\{\{(?:ux|uxi|usex)\|en\|([^|}]*)/);
      if(ux) nyk.esim[nyk.maar.length-1] = siistiWiki(ux[1]);
    }
  }
  const tulos = ryhmat.filter(x=>x.maar.length);
  return tulos.length ? {ryhmat:tulos.slice(0,3), kuva} : null;
}

async function sanatTietoineen(sanat){
  const j = await getJSON(API.wikt(KIELI)+"&prop=revisions&rvprop=content&rvslots=main&titles="+encodeURIComponent(sanat.slice(0,25).join("|")));
  const jasenna = KIELI==="en" ? jasennaSanaEn : jasennaSanaFi;
  const tulos = [];
  for(const p of (j.query.pages||[])){
    const s = jasenna(wikitext(p));
    if(s && !SOPIMATON.test(p.title) && !s.ryhmat.some(g=>g.maar.some(m=>SOPIMATON.test(m)))) tulos.push({sana:p.title, ...s});
  }
  return tulos;
}

async function haeSana(){
  for(let y=0;y<4;y++){
    const ehdokkaat = (await satunnaisetSanat(4)).filter(s=>!nahty.has("sana",s));
    if(!ehdokkaat.length) continue;
    const tiedot = shuffle(await sanatTietoineen(ehdokkaat.slice(0,12)));
    // suositaan sanoja, joilla on kuva, useampi merkitys, esimerkkilauseita ja kunnon selitys
    const arvo = x => {
      const maar = x.ryhmat.flatMap(g=>g.maar), esim = x.ryhmat.flatMap(g=>g.esim).filter(Boolean);
      const pituus = maar.reduce((a,m)=>a+m.length,0)/maar.length;
      return (x.kuva?3:0) + Math.min(maar.length,4) + Math.min(esim.length,2) + (pituus>=25?2:0) - (pituus<15?3:0);
    };
    tiedot.sort((a,b)=>arvo(b)-arvo(a));
    const s = tiedot[0];
    if(!s) continue;
    nahty.add("sana",s.sana);
    const [paakuva, muut] = await Promise.all([
      s.kuva ? tiedostonKuva(s.kuva).catch(()=>null) : null,
      artikkelinKuvat(API.wiki(KIELI), s.sana, 8)
    ]);
    const kuvat = yhdistaKuvat([[paakuva], muut], 8);
    return {
      tyyppi:"sana", kieli:KIELI, otsikko:s.sana, ryhmat:s.ryhmat, kuvat, kuva:kuvat[0]||null,
      lahde:{nimi:KIELI==="fi"?"Wikisanakirja":"Wiktionary", url:"https://"+KIELI+".wiktionary.org/wiki/"+urlOsa(s.sana)}
    };
  }
  throw new Error("sana");
}

function infobox(wt,re){
  const re2 = new RegExp(re.source,"gi"), o = {};
  let m;
  while((m = re2.exec(wt))){
    const a = m.index; let d=0, i=a;
    for(; i<wt.length; i++){
      if(wt.startsWith("{{",i)){ d++; i++; }
      else if(wt.startsWith("}}",i)){ d--; i++; if(d===0) break; }
    }
    const body = wt.slice(a+2,i-1), osat=[]; let dd=0, bb=0, cur="";
    for(let k=0;k<body.length;k++){
      const c=body[k], n=body[k+1];
      if(c==="{"&&n==="{"){ dd++; cur+="{{"; k++; continue; }
      if(c==="}"&&n==="}"){ dd--; cur+="}}"; k++; continue; }
      if(c==="["&&n==="["){ bb++; cur+="[["; k++; continue; }
      if(c==="]"&&n==="]"){ bb--; cur+="]]"; k++; continue; }
      if(c==="|"&&dd===0&&bb===0){ osat.push(cur); cur=""; continue; }
      cur+=c;
    }
    osat.push(cur);
    for(const p of osat.slice(1)){
      const e=p.indexOf("="); if(e<0) continue;
      const k=p.slice(0,e).trim().toLowerCase().replace(/ /g,"_");
      const v=siistiWiki(p.slice(e+1).replace(/^\s*\*+\s*/,"").replace(/\n\s*\*+\s*/g,", "));
      if(v && !(k in o)) o[k]=v;
    }
    re2.lastIndex = i;
  }
  return Object.keys(o).length ? o : null;
}
function lyhytArvo(v,max=130){
  if(v.length<=max) return v;
  const cut=v.slice(0,max), i=cut.lastIndexOf(", ");
  return (i>40?cut.slice(0,i):cut.replace(/\s+\S*$/,""))+" …";
}
async function merkittavat(titles,minPituus){
  const valinta = shuffle(titles).slice(0,45);
  const j = await getJSON(API.wiki("en")+"&prop=info|pageimages&piprop=name&titles="+encodeURIComponent(valinta.join("|")));
  return (j.query.pages||[]).filter(p=>!p.missing && p.length>=minPituus && p.pageimage).map(p=>p.title);
}

async function kulkuneuvo(laji,enNimi){
  const L = LAJIT[laji], fi = KIELI==="fi";
  const [enSum, wtj, llj, kuvat] = await Promise.all([
    summary("en",enNimi).catch(()=>null),
    getJSON(API.wiki("en")+"&redirects=1&prop=revisions&rvprop=content&rvslots=main&rvsection=0&titles="+encodeURIComponent(enNimi)).catch(()=>null),
    fi ? getJSON(API.wiki("en")+"&redirects=1&prop=langlinks&lllang=fi&titles="+encodeURIComponent(enNimi)).catch(()=>null) : null,
    artikkelinKuvat(API.wiki("en"), enNimi, 10)
  ]);
  let fiSum = null;
  const ln = llj && llj.query.pages[0] && llj.query.pages[0].langlinks;
  if(ln && ln[0]) fiSum = await summary("fi",ln[0].title).catch(()=>null);
  const d = (fiSum && fiSum.extract && fiSum.extract.length>80) ? fiSum : enSum;
  if(!d || !d.extract || d.extract.length<80 || d.type==="disambiguation") return null;
  const ib = wtj ? infobox(wikitext(wtj.query.pages[0]), L.infobox) : null;
  const tiedot = [];
  if(ib) for(const [k,nfi,nen] of L.kentat){ const n = fi?nfi:nen; if(ib[k] && !tiedot.some(t=>t[0]===n)) tiedot.push([n,lyhytArvo(ib[k])]); }
  const kaikki = yhdistaKuvat([[kuvaRestista(enSum), kuvaRestista(fiSum)], kuvat], 10);
  return {
    tyyppi:laji, kieli:KIELI, otsikko:d.title, teksti:lyhenna(d.extract,700),
    tiedot:tiedot.slice(0,10), kuvat:kaikki, kuva:kaikki[0]||null,
    lahde:{nimi: (fi && d!==fiSum) ? "Wikipedia (englanniksi)" : "Wikipedia", url:d.content_urls.desktop.page}
  };
}

async function haeKulkuneuvo(laji){
  const L = LAJIT[laji], vuosiNyt = new Date().getFullYear();
  for(let y=0;y<5;y++){
    try{
      const vuosi = L.vuodet[0] + Math.floor(Math.random()*(vuosiNyt-L.vuodet[1]-L.vuodet[0]+1));
      const cm = await getJSON(API.wiki("en")+"&list=categorymembers&cmtype=page&cmnamespace=0&cmlimit=500&cmtitle="+encodeURIComponent(L.luokka(vuosi)));
      const kaikki = cm.query.categorymembers.map(m=>m.title).filter(t=>!/^List of/i.test(t) && !nahty.has(laji,t));
      if(!kaikki.length) continue;
      const hyvat = await merkittavat(kaikki, L.minPituus).catch(()=>[]);
      const nimi = pick(hyvat.length ? hyvat : kaikki);
      const item = await kulkuneuvo(laji,nimi);
      if(!item) continue;
      nahty.add(laji,nimi);
      item.vuosi = vuosi; item.chipAvain = L.chip;
      return item;
    }catch(e){}
  }
  if(laji==="auto"){

const KYSELYT = {
  paakaupunki: "SELECT ?maa ?kaupunki ?fiArt ?enArt WHERE { ?maa wdt:P31 wd:Q3624078; wdt:P36 ?kaupunki. FILTER NOT EXISTS { ?maa wdt:P576 [] } ?fiArt schema:about ?kaupunki; schema:isPartOf <https://fi.wikipedia.org/>. ?enArt schema:about ?kaupunki; schema:isPartOf <https://en.wikipedia.org/>. }",
  kaupunki: "SELECT ?maa ?kaupunki ?fiArt ?enArt WHERE { ?kaupunki wdt:P31 wd:Q515; wdt:P1082 ?asukkaat; wdt:P17 ?maa. FILTER(?asukkaat > 400000) ?fiArt schema:about ?kaupunki; schema:isPartOf <https://fi.wikipedia.org/>. ?enArt schema:about ?kaupunki; schema:isPartOf <https://en.wikipedia.org/>. }"
};
async function kaupunkiLista(tila){
  const avain = "kaupungit-"+tila;
  const c = store.get(avain,null);
  if(c && Date.now()-c.aika < 30*864e5 && c.rivit && c.rivit.length>100) return c.rivit;
  const j = await getJSON("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(KYSELYT[tila]), 30000);
  const art = v => { let a = v.split("/wiki/")[1]; try{ a = decodeURIComponent(a); }catch(e){} return a.replace(/_/g," "); };
  const rivit = [], nahdyt = new Set();
  for(const b of j.results.bindings){
    const k = b.kaupunki.value.split("/").pop();
    if(nahdyt.has(k)) continue; nahdyt.add(k);
    rivit.push({maa:b.maa.value.split("/").pop(), kaupunki:k, fi:art(b.fiArt.value), en:art(b.enArt.value)});
  }
  store.set(avain,{aika:Date.now(),rivit});
  return rivit;
}
function wdArvot(ent,p){
  return ((ent && ent.claims && ent.claims[p])||[])
    .filter(x=>x.mainsnak && x.mainsnak.datavalue && x.rank!=="deprecated")
    .sort((a,b)=>(b.rank==="preferred")-(a.rank==="preferred"))
    .map(x=>x.mainsnak.datavalue.value);
}
const wdNimi = ent => { if(!ent || !ent.labels) return ""; const l = ent.labels[KIELI] || ent.labels.en || ent.labels.fi; return l ? l.value : ""; };
const luku = v => v && v.amount ? Math.round(+v.amount).toLocaleString(lokaali()) : "";

async function haePaakaupunki(){
  const tila = PK_TILA, rivit = await kaupunkiLista(tila);
  let vapaat = rivit.filter(r=>!nahty.has(tila,r.kaupunki));
  if(!vapaat.length){ nahty.nollaaAihe(tila); vapaat = rivit; }
  for(const r of shuffle(vapaat).slice(0,3)){
    try{
      const artikkeli = KIELI==="fi" ? r.fi : r.en;
      const [e, d, kuvat] = await Promise.all([
        getJSON(API.wikidata()+"&props=labels|claims&ids="+r.maa+"|"+r.kaupunki),
        summary(KIELI, artikkeli),
        artikkelinKuvat(API.wiki(KIELI), artikkeli, 10)
      ]);
      const maa = e.entities[r.maa], kau = e.entities[r.kaupunki];
      const osat = wdArvot(maa,"P30").slice(0,2), kielet = wdArvot(maa,"P37").slice(0,3), valuutat = wdArvot(maa,"P38").slice(0,1);
      const ids = [...osat,...kielet,...valuutat].map(v=>v.id).filter(Boolean);
      const nimet = {};
      if(ids.length){
        const l = await getJSON(API.wikidata()+"&props=labels&ids="+ids.join("|")).catch(()=>null);
        if(l) for(const id of ids) nimet[id] = wdNimi(l.entities[id]);
      }
      const nim = lista => [...new Set(lista.map(v=>nimet[v.id]).filter(Boolean).map(isoAlku))].join(", ");
      const lippu = wdArvot(maa,"P41")[0];
      const pinta = luku(wdArvot(maa,"P2046")[0]);
      const korkeus = wdArvot(kau,"P2044")[0];
      const koord = wdArvot(kau,"P625")[0];
      const tiedot = [
        [T("maa"), wdNimi(maa)], [T("maanosa"), nim(osat)],
        [T("asukasluku"), luku(wdArvot(kau,"P1082")[0])],
        [T("korkeus"), korkeus && korkeus.amount ? Math.round(+korkeus.amount)+" m" : ""],
        [T("maan_asukasluku"), luku(wdArvot(maa,"P1082")[0])],
        [T("pinta_ala"), pinta ? pinta+" km²" : ""],
        [T("kieli"), nim(kielet)], [T("valuutta"), nim(valuutat)]
      ].filter(t=>t[1]);
      nahty.add(tila,r.kaupunki);
      const kaikki = yhdistaKuvat([[kuvaRestista(d)], kuvat], 10);
      return {
        tyyppi:"paakaupunki", tila, kieli:KIELI, otsikko:wdNimi(kau)||d.title, maa:wdNimi(maa),
        lippu: lippu ? "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(lippu)+"?width=80" : null,
        koord: koord ? {lat:koord.latitude, lon:koord.longitude} : null,
        teksti:lyhenna(d.extract,700), tiedot, kuvat:kaikki, kuva:kaikki[0]||null,
        lahde:{nimi:"Wikipedia", url:d.content_urls.desktop.page}
      };
    }catch(e){}
  }
  throw new Error("paakaupunki");
}

function jasennaVitsit(wt){
  return wt.split(/^-{4,}\s*$/m).map(osa=>{
    const t = osa.replace(/<br\s*\/?>/gi,"\n").replace(/\[\[(?:Luokka|Category):[^\]]*\]\]/gi,"");
    return t.split("\n").map(r=>r.trim())
      .filter(r=>r && !/^=+.*=+$/.test(r) && !/^\{\{|^\}\}|^__|^<\/?(center|table|tr|td|div)/i.test(r))
      .map(r=>siistiWiki(r)).filter(Boolean).join("\n");
  }).filter(t=>t.length>=25 && t.length<=900 && !/vitsi on|vitsikantamme|tarkoitus on koota/i.test(t) && !SOPIMATON_VITSI.test(t));
}

   en: englanninkielisen Wikiquoten "Quote of the day" -arkisto
   ========================================================= */
const AJATTELIJAT = ["Albert Einstein","Michel de Montaigne","Benjamin Franklin","Khalil Gibran","Seneca","Kungfutse","Aristoteles","Johann Wolfgang von Goethe","Tove Jansson","Aleksis Kivi","Mark Twain","Oscar Wilde","Marcus Aurelius","Sokrates","Platon","Epiktetos","Friedrich Nietzsche","Leo Tolstoi","Abraham Lincoln","Blaise Pascal","Voltaire","Søren Kierkegaard","Arthur Schopenhauer","Ralph Waldo Emerson","Henry David Thoreau","Antoine de Saint-Exupéry","Astrid Lindgren","Eino Leino","J. V. Snellman","Johan Ludvig Runeberg","Zachris Topelius","Väinö Linna","Jean Sibelius","Isaac Newton","Leonardo da Vinci","Helen Keller","Thomas Edison"];
let viikonSitaatit = null;
const vieraskieli = t => (t.match(/\b(the|and|of|is|you|to|in|que|est|les|und|der|die|das|nicht|non|et|le|la)\b/gi)||[]).length>=2 && !/[äö]/i.test(t);
const ilmanLainausmerkkeja = t => {
  t = t.replace(/\s*\[[^\]]{1,60}\]\s*$/,"").replace(/^["“”„«»'’\s]+|["“”„«»'’\s,;]+$/g,"").trim();
  // pariton sisempi lainausmerkki pois
  if((t.match(/[”“"]/g)||[]).length===1) t = t.replace(/[”“"]/,"");
  return t;
};
const SOPIMATON_LAUSE = /sängy|seks|biseks|alastom|huor|raisk|porno|vittu|paska|perse|kyrp|pillu|natsi|murha|itsemurh|\bsex|whore|fuck|shit|\brape|porn|nazi|suicid|murder/i;

async function viikonSitaatti(){
  if(!viikonSitaatit){
    let kaikki=[], cont="";
    for(let k=0;k<3;k++){
      const a = await getJSON(API.quote("fi")+"&list=allpages&apnamespace=10&apprefix="+encodeURIComponent("Viikon sitaatti/")+"&aplimit=500"+cont);
      kaikki = kaikki.concat(a.query.allpages.map(x=>x.title));
      if(!a.continue) break;
      cont = "&apcontinue="+encodeURIComponent(a.continue.apcontinue);
    }
    viikonSitaatit = kaikki;
  }
  const valinta = shuffle(viikonSitaatit).slice(0,10);
  const j = await getJSON(API.quote("fi")+"&prop=revisions&rvprop=content&rvslots=main&titles="+encodeURIComponent(valinta.join("|")));
  for(const p of shuffle(j.query.pages||[])){
    const t = siistiWiki(wikitext(p));
    if(!t) continue;
    const m = t.match(/^(.*\S)\s*(?:[–—]|\s-)\s*([^–—]{2,90})$/);
    let lause = m ? m[1] : t; const tekija = m ? m[2].trim() : "";
    lause = ilmanLainausmerkkeja(lause);
    if(!tekija || /tyhjennetty|mallinesivu|^\(|^[^"”:]{3,40}:\s/i.test(lause) || SOPIMATON_LAUSE.test(lause) || lause.length<20 || lause.length>380 || nahty.has("mietelause",lause.slice(0,80))) continue;
    return {lause, tekija, sivu:"https://fi.wikiquote.org/wiki/"+urlOsa(p.title), sivuNimi:"Wikisitaatit, viikon sitaatti"};
  }
  return null;
}
async function ajattelijanSitaatti(){
  const nimi = pick(AJATTELIJAT);
  const j = await getJSON(API.quote("fi")+"&redirects=1&prop=revisions&rvprop=content&rvslots=main&titles="+encodeURIComponent(nimi));
  const p = j.query.pages[0], wt = wikitext(p);
  if(!wt) return null;
  const rivit = wt.split("\n"), ehdokkaat = [];
  let mukana = true;
  rivit.forEach((r,n)=>{
    if(/^==/.test(r)){ mukana = !/lähte|aiheesta muualla|katso myös|virheellis|kiistanalai|hänestä|muiden sanomaa|kirjallisuutta|viitteet/i.test(r); return; }
    if(!mukana || !/^\*(?![*:])/.test(r)) return;
    let lause = siistiWiki(r.replace(/^\*\s*/,""));
    if(vieraskieli(lause) && /^\*\*/.test(rivit[n+1]||"")) lause = siistiWiki(rivit[n+1].replace(/^\*+\s*/,""));
    lause = ilmanLainausmerkkeja(lause);
    if(lause.length<25 || lause.length>320 || vieraskieli(lause) || SOPIMATON_LAUSE.test(lause) || /https?:|www\./.test(lause) || nahty.has("mietelause",lause.slice(0,80))) return;
    ehdokkaat.push(lause);
  });
  if(!ehdokkaat.length) return null;
  return {lause:pick(ehdokkaat), tekija:p.title, sivu:"https://fi.wikiquote.org/wiki/"+urlOsa(p.title), sivuNimi:"Wikisitaatit"};
}
const KUUKAUDET = ["January","February","March","April","May","June","July","August","September","October","November","December"];
async function paivanSitaattiEn(){
  // arvotaan 12 päivämäärää vuosilta 2012–(edellinen vuosi) ja haetaan ne yhdellä kyselyllä
  const viimeinen = new Date().getFullYear()-1, otsikot = [];
  for(let i=0;i<12;i++){
    const v = 2012+Math.floor(Math.random()*(viimeinen-2012+1)), kk = Math.floor(Math.random()*12), pv = 1+Math.floor(Math.random()*28);
    otsikot.push("Wikiquote:Quote of the day/"+KUUKAUDET[kk]+" "+pv+", "+v);
  }
  const j = await getJSON(API.quote("en")+"&prop=revisions&rvprop=content&rvslots=main&titles="+encodeURIComponent(otsikot.join("|")));
  for(const p of shuffle(j.query.pages||[])){
    const wt = wikitext(p); if(!wt) continue;
    const q = wt.match(/\|\s*quote\s*=\s*([\s\S]*?)\n\s*\|\s*author\s*=\s*([^\n|}]*)/i);
    if(!q) continue;
    const lause = ilmanLainausmerkkeja(siistiWiki(q[1].replace(/<br\s*\/?>/gi," ").replace(/\n/g," ")));
    const tekija = siistiWiki(q[2]);
    if(!tekija || lause.length<20 || lause.length>380 || SOPIMATON_LAUSE.test(lause) || nahty.has("mietelause",lause.slice(0,80))) continue;
    return {lause, tekija, sivu:"https://en.wikiquote.org/wiki/"+urlOsa(p.title), sivuNimi:"Wikiquote, Quote of the day"};
  }
  return null;
}
async function haeMietelause(){
  for(let y=0;y<5;y++){
    let s = null;
    if(KIELI==="en"){ try{ s = await paivanSitaattiEn(); }catch(e){} }
    else{
      try{ s = (y%2===0 && Math.random()<0.5) ? await viikonSitaatti() : await ajattelijanSitaatti(); }catch(e){}
      if(!s){ try{ s = await viikonSitaatti(); }catch(e){} }
    }
    if(!s) continue;
    nahty.add("mietelause",s.lause.slice(0,80));
    return {tyyppi:"mietelause", kieli:KIELI, otsikko:s.lause, tekija:s.tekija, lahde:{nimi:s.sivuNimi, url:s.sivu}};
  }
  throw new Error("mietelause");
}

// Kuvagalleria: nuolet, laskuri, nuolinäppäimet ja pyyhkäisy
function teeGalleria(kuvat,alt,sailio){
  const lista = kuvat.slice();
  let i = 0;
  const fig = el("figure",null,"gal"), stage = el("div",null,"stage");
  const a = link("",""), im = el("img");
  a.title = T("kuvan_sivu"); a.append(im); stage.append(a);
  const ed = nappi("‹","nav prev",()=>nayta(i-1),T("ed_kuva")), se = nappi("›","nav next",()=>nayta(i+1),T("seur_kuva"));
  const laskuri = el("span","","count");
  stage.append(ed,se,laskuri);
  const cap = el("figcaption");
  fig.append(stage,cap);

  function napit(){ const monta = lista.length>1; ed.hidden = se.hidden = laskuri.hidden = !monta; }
  function nayta(n){
    i = (n+lista.length)%lista.length;
    const k = lista[i];
    im.src = k.src; im.alt = alt+(lista.length>1 ? ", "+(i+1)+"/"+lista.length : "");
    a.href = k.sivu; a.setAttribute("aria-label",T("kuvan_sivu")+": "+alt);
    cap.replaceChildren(T("kuva"));
    if(k.tekija) cap.append(k.tekija+" / ");
    cap.append(link(k.sivu, /commons/.test(k.sivu)?"Wikimedia Commons":"Wikipedia"));
    if(k.lisenssi) cap.append(", "+k.lisenssi);
    laskuri.textContent = (i+1)+" / "+lista.length;
    if(lista.length>1){ const esi = new Image(); esi.src = lista[(i+1)%lista.length].src; }
  }
  im.onerror = ()=>{
    const k = lista[i];
    if(k && k.varasrc && im.src!==k.varasrc){ im.src = k.varasrc; return; }
    lista.splice(i,1);
    if(!lista.length){ fig.remove(); if(sailio && !sailio.querySelector(".kartta")){ const o=sailio.parentNode; sailio.remove(); if(o) o.classList.remove("has-img"); } return; }
    napit(); nayta(i>=lista.length ? 0 : i);
  };
  fig.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"){ nayta(i-1); e.preventDefault(); }
    if(e.key==="ArrowRight"){ nayta(i+1); e.preventDefault(); }
  });
  let x0 = null;
  stage.addEventListener("touchstart",e=>{ x0 = e.touches[0].clientX; },{passive:true});
  stage.addEventListener("touchend",e=>{
    if(x0==null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if(Math.abs(dx)>40 && lista.length>1) nayta(i + (dx<0?1:-1));
  });
  napit(); nayta(0);
  return fig;
}

function tietotaulu(tiedot){

// Piirtää kohteen annettuun säiliöön. tiivis = ruudukon pieni ruutu.
// tiivis = "auki": ruudun "Lue lisää" – koko sisältö kuten yksittäisessä näkymässä, mutta allekkain
function piirraSisalto(out,item,tiivis){
  const auki = tiivis==="auki"; if(auki) tiivis = false;
  out.replaceChildren(); out.className = "out";
  const kuvat = item.kuvat || (item.kuva ? [item.kuva] : []);
  const media = el("div",null,"media");
  if(kuvat.length) media.append(teeGalleria(kuvat, item.otsikko, media));
  if(!tiivis && item.koord) media.append(teeKartta(item.koord, item.otsikko));
  if(media.children.length){
    if(!tiivis && !auki) out.classList.add("has-img");
    out.append(media);
  }
  PIIRRA[item.tyyppi](out,item,tiivis);
  if(tiivis && onLisaa(item)) out.append(nappi(T("lue_lisaa_nappi")+" ▾","inline toissijainen",()=>piirraSisalto(out,item,"auki")));
  if(auki) out.append(nappi(T("nayta_vahemman")+" ▴","inline toissijainen",()=>{
    piirraSisalto(out,item,true);
    const t = out.closest(".tile"); if(t) t.scrollIntoView({block:"nearest"});
  }));
}
// Onko tiiviissä ruudussa piilossa jotain, mitä "Lue lisää" näyttäisi
function onLisaa(item){
  if(item.ryhmat) return item.ryhmat.length>1 || item.ryhmat.some(g=>g.maar.length>3 || g.esim.some(Boolean));
  return !!((item.teksti && item.teksti.length>300) || (item.tiedot && item.tiedot.length) || item.koord);
}

function korttiTeksti(k,item){
  if(k==="mietelause") return "”"+item.otsikko+"”";
  if(k==="paakaupunki" && item.maa) return item.otsikko+", "+item.maa;
  if(k==="vitsi") return item.otsikko.replace(/^[–-]\s*/,"");

function teeKortit(){

    const b = nappi(null,"card",()=>valitseAihe(k));

    const txt = el("span",null,"txt");
    txt.append(el("span",LYHYT(k),"lbl"), el("span",T("haetaan"),"prev wait"));

function paivitaKortit(){
  for(const k of AIHEET){
    const b = $("card-"+k); if(!b) continue;
    b.setAttribute("aria-selected", String(tila.nakyma!=="suosikit" && tila.nakyma!=="ruudukko" && tila.aihe===k));
    const item = paiva.get(k), prev = b.querySelector(".prev");
    const vanha = b.querySelector("img"); if(vanha) vanha.remove();
    if(item){
      prev.className="prev"; prev.textContent = korttiTeksti(k,item);
      const kuva = (item.kuvat && item.kuvat[0]) || item.kuva;
      if(kuva){ const im = el("img"); im.alt=""; im.src=kuva.src; im.onerror=()=>im.remove(); b.insertBefore(im,b.firstChild); }
    } else if(tila.haussa[hakuAvain(k)]==="virhe"){
      prev.className="prev wait"; prev.textContent=T("kortti_virhe");
    } else {
      prev.className="prev wait"; prev.textContent=T("haetaan");
    }
  }
}
function naytaKortti(k){
  const b = $("card-"+k), c = $("cards");
  if(b && c.scrollWidth>c.clientWidth){
    const vasen = b.offsetLeft - c.offsetLeft, oikea = vasen + b.offsetWidth;
    if(vasen < c.scrollLeft || oikea > c.scrollLeft + c.clientWidth) c.scrollTo({left: Math.max(0, vasen-12), behavior:"smooth"});

}

// Päivän valinta: haetaan kerran päivässä (kielikohtaisesti) ja tallennetaan selaimeen
const hakuAvain = k => paivaAvain(k);
async function paivanValinta(k){
  const valmis = paiva.get(k);
  if(valmis) return valmis;
  const ha = hakuAvain(k);
  if(tila.haussa[ha] instanceof Promise) return tila.haussa[ha];
  const kieli = KIELI, pk = PK_TILA;
  const p = HAKU[k]().then(item=>{
      // tallennetaan vain, jos kieli ja tila eivät vaihtuneet kesken haun
      if(kieli===KIELI && pk===PK_TILA && !paiva.get(k)) paiva.set(k,item);
      tila.haussa[ha]=null; return item;
    })
    .catch(e=>{ tila.haussa[ha]="virhe"; throw e; })
    .finally(()=>{ paivitaKortit(); });
  tila.haussa[ha] = p;
  return p;
}

async function valitseAihe(k){
  tila.aihe = k; tila.nakyma = "aihe"; store.set("valittu-aihe",k); store.set("nakyma","aihe");
  tila.item = null; paivitaToiminnot(); paivitaKortit(); naytaKortti(k);
  otsikko(NIMI(k),T("paivan_valinta"));
  const valmis = paiva.get(k);
  if(valmis){ naytaItem(valmis,T("paivan_valinta")); return; }
  naytaLataus();
  const kieli = KIELI;
  try{
    const item = await paivanValinta(k);
    if(tila.aihe===k && tila.nakyma==="aihe" && kieli===KIELI) naytaItem(item,T("paivan_valinta"));
  }catch(e){
    if(tila.aihe===k && tila.nakyma==="aihe") naytaVirhe(null,()=>valitseAihe(k));
  }
}

// "Näytä toinen" vaihtaa aiheen päivän valinnan, joten myös yläreunan kortti päivittyy
async function naytaToinen(){
  if(tila.nakyma==="visa") return uusiVisa();
  const k = tila.aihe, btn = $("uusiBtn"), kieli = KIELI;
  tila.nakyma = "aihe"; paivitaKortit();
  btn.disabled = true; btn.textContent = T("haetaan");
  naytaLataus(); otsikko(NIMI(k));
  try{
    const item = await HAKU[k]();
    if(kieli!==KIELI) return;
    paiva.set(k,item); paivitaKortit();
    if(tila.aihe===k && tila.nakyma==="aihe") naytaItem(item,T("paivan_valinta"));
  }catch(e){
    if(tila.aihe===k) naytaVirhe(null,naytaToinen);
  }finally{
    btn.disabled = false; paivitaToiminnot();
  }
}

/* ---------- Ruudukkonäkymä (1–4 aihetta) ---------- */
function teeRuudukkoAsetukset(){
  const r = $("rasetukset"); r.replaceChildren(el("span",T("valitse"),"ohje"));
  for(const k of AIHEET){
    const valittu = tila.ruudukko.includes(k);
    const b = nappi(LYHYT(k),"valinta",()=>{
      if(valittu){ if(tila.ruudukko.length>1) tila.ruudukko = tila.ruudukko.filter(x=>x!==k); }
      else if(tila.ruudukko.length<4) tila.ruudukko = tila.ruudukko.concat(k);
      tila.ruudukko = AIHEET.filter(x=>tila.ruudukko.includes(x));
      store.set("ruudukko-aiheet",tila.ruudukko);
      teeRuudukkoAsetukset(); teeRuudukko();
    });
    b.setAttribute("aria-pressed",String(valittu));
    if(!valittu && tila.ruudukko.length>=4) b.disabled = true;
    r.append(b);
  }
  r.append(el("span",tila.ruudukko.length+" / 4","ohje"));
  // Päivittää vain ruudukossa näkyvät aiheet: painaa jokaisen ruudun ↻-painiketta
  const kaikki = nappi("↻ "+T("paivita_kaikki"),"valinta paivita-kaikki",()=>{
    $("ruudukko").querySelectorAll(".tile .paivita:not(:disabled)").forEach(b=>b.click());
  });
  r.append(kaikki);
}
function teeRuudukko(){
  const g = $("ruudukko"), n = tila.ruudukko.length;
  g.className = "ruudukko n"+n; g.replaceChildren();
  for(const k of tila.ruudukko){
    const tile = el("section",null,"tile"), top = el("div",null,"ptop"), h = el("h2",NIMI(k)), out = el("div",null,"out");
    const toiminnot = el("div",null,"actions");
    const uusi = nappi("↻","btn paivita",async()=>{
      uusi.disabled = true; naytaLataus(out);
      const kieli = KIELI;
      try{ const item = await HAKU[k](); if(kieli!==KIELI) return; paiva.set(k,item); paivitaKortit(); piirraSisalto(out,item,n>1); }
      catch(e){ naytaVirhe(out,()=>uusi.click()); }
      finally{ uusi.disabled = false; }
    },T("nayta_toinen"));
    const avaa = nappi(T("avaa"),"btn",()=>valitseAihe(k));
    toiminnot.append(uusi,avaa); top.append(h,toiminnot); tile.append(top,out); g.append(tile);
    const valmis = paiva.get(k);
    if(valmis) piirraSisalto(out,valmis,n>1);
    else{
      naytaLataus(out);
      const kieli = KIELI;
      paivanValinta(k).then(item=>{ if(kieli===KIELI && out.isConnected) piirraSisalto(out,item,n>1); })
        .catch(()=>{ if(out.isConnected) naytaVirhe(out,teeRuudukko); });
    }
  }
}
function naytaRuudukko(){
  tila.nakyma = "ruudukko"; tila.item = null; store.set("nakyma","ruudukko");
  paivitaToiminnot(); teeRuudukkoAsetukset(); teeRuudukko();
}

/* ---------- Jakaminen ---------- */
function jakoteksti(item){
  const nimi = NIMI(item.tyyppi,item);
  if(item.tyyppi==="sana") return nimi+": "+item.otsikko+" – "+item.ryhmat[0].maar[0];
  if(item.tyyppi==="mietelause") return "”"+item.otsikko+"”"+(item.tekija?" – "+item.tekija:"");
  if(item.tyyppi==="vitsi") return nimi+":\n"+item.teksti;
  return nimi+": "+korttiTeksti(item.tyyppi,item)+" – "+lyhenna(item.teksti,220);
}
async function jaa(){
  const item = tila.item; if(!item) return;
  const teksti = jakoteksti(item), url = item.lahde.url;
  if(navigator.share && matchMedia("(pointer:coarse)").matches){
    try{ await navigator.share({title:NIMI(item.tyyppi,item), text:teksti, url}); return; }catch(e){ if(e && e.name==="AbortError") return; }
  }
  const kaikki = teksti+"\n"+url;
  try{ await navigator.clipboard.writeText(kaikki); ilmoita(T("kopioitu")); return; }catch(e){}
  try{
    const ta = el("textarea"); ta.value = kaikki; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.append(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
    ilmoita(ok ? T("kopioitu") : T("kopiointi_ei"));
  }catch(e){ ilmoita(T("kopiointi_ei")); }
}
let toastAjastin;
function ilmoita(t){
  const n = $("toast"); n.textContent = t; n.classList.add("show");
  clearTimeout(toastAjastin); toastAjastin = setTimeout(()=>n.classList.remove("show"),2200);
}

/* ---------- Sanavisa ---------- */
const pisteet = { get(){ return store.get("visa-pisteet",{oikein:0,yhteensa:0}); }, lisaa(ok){ const p=this.get(); p.yhteensa++; if(ok) p.oikein++; store.set("visa-pisteet",p); return p; } };
function ensimmainenMaar(s){
  const m = s.ryhmat[0].maar[0].replace(/^\([^)]*\)\s*/,"");
  // sanaa itseään ei näytetä vaihtoehdossa
  return m.replace(new RegExp(s.sana.replace(/[^\wåäö]/gi,"\\$&"),"gi"),"___");
}
async function uusiVisa(){
  tila.nakyma = "visa"; tila.item = null; paivitaToiminnot();
  otsikko(T("sanavisa")); naytaLataus(null,T("arvotaan"));
  const btn = $("uusiBtn"); btn.disabled = true;
  try{
    const sanat = [];
    for(let y=0;y<3 && sanat.length<3;y++){
      const ehdokkaat = await satunnaisetSanat(3);
      const tiedot = (await sanatTietoineen(ehdokkaat.slice(0,10))).filter(s=>{ const m=ensimmainenMaar(s); return m.length>=8 && m.length<=180 && !/^ks\.|^katso|^see\b/i.test(m); });
      for(const t of tiedot) if(sanat.length<3 && !sanat.some(x=>x.sana===t.sana || ensimmainenMaar(x)===ensimmainenMaar(t))) sanat.push(t);
    }
    if(sanat.length<3) throw new Error("visa");
    if(tila.nakyma!=="visa") return;
    const oikea = sanat[0];
    const out = $("tulos"); out.className="out"; out.replaceChildren();
    const q = el("p",null,"q"); q.append(T("visa1"), el("strong",oikea.sana), T("visa2"));
    const opts = el("div",null,"opts");
    const tulosRivi = el("p",null,"score");
    const p0 = pisteet.get();
    tulosRivi.textContent = T("pisteet")+p0.oikein+" / "+p0.yhteensa;
    for(const s of shuffle(sanat)){
      const b = nappi(ensimmainenMaar(s),"opt",()=>{
        const ok = s===oikea, p = pisteet.lisaa(ok);
        opts.querySelectorAll("button").forEach(x=>{ x.disabled=true; });
        b.classList.add(ok?"right":"wrong");
        if(!ok){ const o = opts.querySelector('[data-oikea="1"]'); if(o) o.classList.add("right"); }
        tulosRivi.textContent = (ok ? T("oikein") : T("vaarin")) + T("pisteet")+p.oikein+" / "+p.yhteensa;
        const lisa = el("p",null,"src");
        lisa.append(T("lue_lisaa"), link("https://"+KIELI+".wiktionary.org/wiki/"+urlOsa(oikea.sana),oikea.sana));
        out.append(lisa);
      });
      if(s===oikea) b.dataset.oikea="1";
      opts.append(b);
    }
    out.append(q,opts,tulosRivi);
  }catch(e){
    if(tila.nakyma==="visa") naytaVirhe(null,uusiVisa);
  }finally{ btn.disabled=false; paivitaToiminnot(); }
}

/* =========================================================
   Tähtitausta: tähdet liikkuvat hitaasti ja yhdistyvät viivoilla kursoriin
   ========================================================= */
const tahtitaivas = (()=>{
  const c = $("tahdet"), x = c.getContext("2d");
  const liike = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0, H=0, tahdet=[], mx=-9999, my=-9999, vari="#fff", viiva="#6cc0dc", ajastus=null;
  const SADE = 170, VALI = 95;
  function uusi(){ return {x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22, r:Math.random()*1.3+.45, p:Math.random()*6.28}; }
  function koko(){
    const dpr = Math.min(2, window.devicePixelRatio||1);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
    c.style.width = W+"px"; c.style.height = H+"px";
    x.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.max(40, Math.min(170, Math.round(W*H/8500)));
    while(tahdet.length<n) tahdet.push(uusi());
    tahdet.length = n;
    if(!liike) piirra(0);
  }
  function varit(){
    const s = getComputedStyle(document.documentElement);
    vari = s.getPropertyValue("--tahti").trim() || vari;
    viiva = s.getPropertyValue("--viiva").trim() || viiva;
    if(!liike) piirra(0);
  }
  function piirra(t){
    x.clearRect(0,0,W,H);
    const lahella = [];
    x.fillStyle = vari;
    for(const s of tahdet){
      if(liike){
        s.x += s.vx; s.y += s.vy;
        if(s.x<-5) s.x=W+5; else if(s.x>W+5) s.x=-5;
        if(s.y<-5) s.y=H+5; else if(s.y>H+5) s.y=-5;
      }
      x.globalAlpha = liike ? .55+.45*Math.sin(t*.0015+s.p) : .8;
      x.beginPath(); x.arc(s.x,s.y,s.r,0,6.283); x.fill();
      const dx = s.x-mx, dy = s.y-my, d = Math.sqrt(dx*dx+dy*dy);
      if(d<SADE) lahella.push([s,d]);
    }
    x.strokeStyle = viiva; x.lineWidth = .8;
    for(const [s,d] of lahella){
      x.globalAlpha = (1-d/SADE)*.75;
      x.beginPath(); x.moveTo(s.x,s.y); x.lineTo(mx,my); x.stroke();
    }
    // lähellä kursoria olevat tähdet yhdistyvät myös toisiinsa
    for(let i=0;i<lahella.length;i++) for(let j=i+1;j<lahella.length;j++){
      const a = lahella[i][0], b = lahella[j][0], dx = a.x-b.x, dy = a.y-b.y, d = Math.sqrt(dx*dx+dy*dy);
      if(d<VALI){ x.globalAlpha = (1-d/VALI)*.35; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); }
    }
    x.globalAlpha = 1;
  }
  function silmukka(t){ if(!document.hidden) piirra(t); ajastus = requestAnimationFrame(silmukka); }
  function siirto(px,py){ mx = px; my = py; if(!liike) piirra(0); }
  window.addEventListener("pointermove",e=>siirto(e.clientX,e.clientY),{passive:true});
  window.addEventListener("pointerdown",e=>siirto(e.clientX,e.clientY),{passive:true});
  document.addEventListener("pointerleave",()=>siirto(-9999,-9999));
  window.addEventListener("blur",()=>siirto(-9999,-9999));
  window.addEventListener("resize",koko);
  koko(); varit();
  if(liike) ajastus = requestAnimationFrame(silmukka);
  return {varit};
})();

/* =========================================================
   Kissagif: Giphy (oma ilmainen avain) tai cataas.com
   ========================================================= */
const kissa = (()=>{
  const img = $("kissaImg"), txt = $("kissaTxt");
  let ajastin = null, lahde = null;
  const box = $("kissaBox");
  // Koko tallennetaan selaimeen. Rajat: 80 px – 420 px (tai näytön leveys).
  const MIN = 100;
  // toive = käyttäjän valitsema koko, koko = näytetty koko (rajattu näytön mukaan)
  let toive = store.get("kissa-koko", (innerWidth && innerWidth<=760) ? 110 : 150), koko = toive;
  function asetaKoko(w, tallenna){
    if(!innerWidth || !innerHeight) return;   // piilossa oleva välilehti: ei muuteta kokoa
    const max = Math.max(MIN, Math.min(420, innerWidth-48, (innerHeight-130)/0.76));
    koko = Math.round(Math.max(MIN, Math.min(max, w)));
    box.style.setProperty("--kw", koko+"px");
    $("kissaPienempi").disabled = koko<=MIN; $("kissaIsompi").disabled = koko>=max;
    if(tallenna){ toive = koko; store.set("kissa-koko",koko); }
  }
  $("kissaIsompi").addEventListener("click",()=>{ const ennen=koko; asetaKoko(koko*1.25,true); if(ennen<=260 && koko>260 && lahde && lahde.giphy) seuraava(); });
  $("kissaPienempi").addEventListener("click",()=>asetaKoko(koko/1.25,true));
  // Vetokahva: vasemmalle/ylös vetäminen suurentaa, oikealle/alas pienentää
  const kahva = $("kissaKahva");
  let veto = null;
  kahva.addEventListener("pointerdown",e=>{ e.preventDefault(); kahva.setPointerCapture(e.pointerId); veto = {x:e.clientX, y:e.clientY, w:koko}; });
  kahva.addEventListener("pointermove",e=>{
    if(!veto) return;
    const dx = veto.x-e.clientX, dy = (veto.y-e.clientY)/0.76;
    asetaKoko(veto.w + (Math.abs(dx)>Math.abs(dy) ? dx : dy), false);
  });
  const lopeta = ()=>{ if(veto){ veto = null; toive = koko; store.set("kissa-koko",koko); } };
  kahva.addEventListener("pointerup",lopeta); kahva.addEventListener("pointercancel",lopeta);
  // nuolinäppäimillä myös kahvasta
  kahva.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"||e.key==="ArrowLeft"){ asetaKoko(koko+12,true); e.preventDefault(); }
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){ asetaKoko(koko-12,true); e.preventDefault(); }
  });
  window.addEventListener("resize",()=>asetaKoko(toive,false));
  // Giphy-avainta ei pidetä lähdekoodissa. Oletuksena cataas.com; oman avaimen voi syöttää ⚙-painikkeesta,
  // ja se tallentuu vain käyttäjän omaan selaimeen.
  const avain = () => String(store.get("giphy-avain","")||"").trim();
  async function seuraava(){
    let src = null, sivu = null;
    const k = avain();
    if(k){
      try{
        const j = await getJSON("https://api.giphy.com/v1/gifs/random?api_key="+encodeURIComponent(k)+"&tag=cat&rating=g",10000);
        const im = j && j.data && j.data.images;
        if(im){ const v = (koko>260 ? (im.downsized_medium||im.downsized||im.original) : im.fixed_height) || im.fixed_height || im.downsized; src = v.url; sivu = j.data.url; }
      }catch(e){}
    }
    if(!src){ src = "https://cataas.com/cat/gif?_="+Date.now(); sivu = "https://cataas.com"; }
    // ladataan ensin taustalla, jotta kuva ei välähdä tyhjänä
    const esi = new Image();
    esi.onload = ()=>{ img.src = src; img.alt = T("kissa"); lahde = {sivu, giphy: sivu && /giphy/.test(sivu)}; tekstit(); };
    esi.onerror = ()=>{};
    esi.src = src;
  }
  function tekstit(){
    txt.replaceChildren();
    if(lahde && lahde.giphy) txt.append(link(lahde.sivu,"Powered by GIPHY"));
    else txt.append("🐱 "+T("kissa_lyhyt"));
    for(const [id,a] of [["kissaIsompi","kissa_isompi"],["kissaPienempi","kissa_pienempi"],["kissaKahva","kissa_kahva"]]){ $(id).title = T(a); $(id).setAttribute("aria-label",T(a)); }
    $("kissaSeur").title = T("seuraava_kissa"); $("kissaSeur").setAttribute("aria-label",T("seuraava_kissa"));
    $("kissaAsetus").title = T("kissa_asetus"); $("kissaAsetus").setAttribute("aria-label",T("kissa_asetus"));
    $("kissaPiilo").title = T("piilota_kissa"); $("kissaPiilo").setAttribute("aria-label",T("piilota_kissa"));
    $("kissaNayta").title = T("nayta_kissa"); $("kissaNayta").setAttribute("aria-label",T("nayta_kissa"));
  }
  function nakyy(v){
    $("kissaBox").hidden = !v; $("kissaNayta").hidden = v; store.set("kissa-piilossa",!v);
    clearInterval(ajastin);
    if(v){ seuraava(); ajastin = setInterval(()=>{ if(!document.hidden) seuraava(); }, 60000); }
  }
  $("kissaSeur").addEventListener("click",seuraava);
  $("kissaPiilo").addEventListener("click",()=>nakyy(false));
  $("kissaNayta").addEventListener("click",()=>nakyy(true));
  $("kissaAsetus").addEventListener("click",()=>{
    const v = prompt(T("giphy_kysy"), avain());
    if(v===null) return;
    const k = v.trim();
    if(k && !/^[A-Za-z0-9]{20,64}$/.test(k)){ ilmoita(T("giphy_virhe")); return; }
    if(k) store.set("giphy-avain", k); else store.del("giphy-avain");
    ilmoita(k ? T("giphy_ok") : T("giphy_pois"));
    seuraava();
  });
  asetaKoko(toive,false);
  return {tekstit, kaynnista(){ nakyy(!store.get("kissa-piilossa",false)); }};
})();

/* =========================================================
   Sää: Open-Meteo (ei avainta). Kaupunki ja puoli tallennetaan selaimeen.
   ========================================================= */
const saa = (()=>{
  const OLETUS = {nimi:"Helsinki", maa:"FI", lat:60.1699, lon:24.9384};
  // WMO-säätilakoodit → kuvake ja teksti
  const KOODIT = [
    [[0],"☀","Selkeää","Clear"], [[1],"🌤","Enimmäkseen selkeää","Mainly clear"], [[2],"⛅","Puolipilvistä","Partly cloudy"],
    [[3],"☁","Pilvistä","Overcast"], [[45,48],"🌁","Sumua","Fog"], [[51,53,55],"🌦","Tihkusadetta","Drizzle"],
    [[56,57,66,67],"🌧","Jäätävää sadetta","Freezing rain"], [[61,63,65],"🌧","Sadetta","Rain"],
    [[71,73,75,77],"🌨","Lumisadetta","Snow"], [[80,81,82],"🌦","Sadekuuroja","Rain showers"],
    [[85,86],"🌨","Lumikuuroja","Snow showers"], [[95,96,99],"⛈","Ukkosta","Thunderstorm"]
  ];
  const koodi = c => KOODIT.find(r=>r[0].includes(c)) || [[],"·","",""];
  const ikoni = (c,paiva) => (c===0 && !paiva ? "🌙" : koodi(c)[1]).replace(/\uFE0F/g,"")+"\uFE0F";
  const aste = v => Math.round(v)+"°";
  let kaupunki = store.get("saa-kaupunki",OLETUS), data = null, virhe = false;

  function puoli(p){
    document.querySelector(".wrap").classList.remove("saa-vasen","saa-oikea");
    document.querySelector(".wrap").classList.add(p==="oikea" ? "saa-oikea" : "saa-vasen");
  }
  function piirra(){
    $("saaPaikka").textContent = kaupunki.nimi;
    $("saaPaikka").title = [kaupunki.nimi,kaupunki.alue,kaupunki.maa].filter(Boolean).join(", ");
    const nyt = $("saaNyt"), pv = $("saaPaivat");
    if(!data){ nyt.replaceChildren(el("span",virhe ? T("saa_virhe") : T("haetaan"),"saa-kuvaus")); pv.replaceChildren(); return; }
    const c = data.current, kuvaus = el("div",null,"saa-kuvaus");
    kuvaus.append(el("b",koodi(c.weather_code)[KIELI==="fi"?2:3]), el("br"),
      T("tuntuu")+" "+aste(c.apparent_temperature), el("br"),
      T("tuuli")+" "+Math.round(c.wind_speed_10m)+" m/s · "+T("kosteus")+" "+c.relative_humidity_2m+" %");
    nyt.replaceChildren(el("span",ikoni(c.weather_code,c.is_day),"saa-ikoni"), el("span",aste(c.temperature_2m),"saa-temp"), kuvaus);
    const d = data.daily;
    pv.replaceChildren(...d.time.slice(1,4).map((t,i)=>{
      const div = el("div"), mm = el("span",aste(d.temperature_2m_max[i+1]),"mm");
      mm.append(" ", el("span",aste(d.temperature_2m_min[i+1])));
      div.append(el("span",new Date(t+"T12:00").toLocaleDateString(lokaali(),{weekday:"short"}),"pv"),
                 el("span",ikoni(d.weather_code[i+1],1),"ik"), mm);
      div.title = koodi(d.weather_code[i+1])[KIELI==="fi"?2:3];
      return div;
    }));
  }
  async function hae(){
    try{
      data = await getJSON("https://api.open-meteo.com/v1/forecast?latitude="+kaupunki.lat+"&longitude="+kaupunki.lon+
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"+
        "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4&wind_speed_unit=ms");
      virhe = false;
    }catch(e){ virhe = !data; }
    piirra();
  }
  // Kaupungin vaihto lomakkeella: tarkistus ennen hakua, virhe kentän alla
  const lomake = $("saaLomake"), kentta = $("saaHaku"), virheRivi = $("saaVirhe"), haeNappi = $("saaHae");
  function lomakeVirhe(t){ virheRivi.textContent = t||""; kentta.setAttribute("aria-invalid", t ? "true" : "false"); }
  function lomakeAuki(auki){
    lomake.hidden = !auki; $("saaKaupunki").setAttribute("aria-expanded", String(auki)); lomakeVirhe("");
    if(auki){ kentta.value = kaupunki.nimi; kentta.focus(); kentta.select(); }
  }
  $("saaKaupunki").addEventListener("click",()=>lomakeAuki(lomake.hidden));
  kentta.addEventListener("keydown",e=>{ if(e.key==="Escape"){ lomakeAuki(false); $("saaKaupunki").focus(); } });
  kentta.addEventListener("input",()=>{ if(kentta.getAttribute("aria-invalid")==="true") lomakeVirhe(""); });
  lomake.addEventListener("submit",async e=>{
    e.preventDefault();
    const v = kentta.value.trim().replace(/\s+/g," ");
    if(v.length<2) return lomakeVirhe(T("saa_lyhyt"));
    if(!/^[\p{L}\p{M}][\p{L}\p{M} .'’-]*$/u.test(v)) return lomakeVirhe(T("saa_merkit"));
    haeNappi.disabled = true; haeNappi.textContent = T("haetaan");
    try{
      const j = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&language="+KIELI+"&name="+encodeURIComponent(v));
      const r = j.results && j.results[0];
      if(!r) return lomakeVirhe(T("saa_ei_loydy"));
      kaupunki = {nimi:r.name, alue:r.admin1||"", maa:r.country_code||"", lat:r.latitude, lon:r.longitude};
      store.set("saa-kaupunki",kaupunki); data = null; lomakeAuki(false); piirra(); hae();
    }catch(err){ lomakeVirhe(T("saa_virhe")); }
    finally{ haeNappi.disabled = false; haeNappi.textContent = T("saa_hae"); }
  });
  $("saaPuoli").addEventListener("click",()=>{
    const p = store.get("saa-puoli","vasen")==="vasen" ? "oikea" : "vasen";
    store.set("saa-puoli",p); puoli(p);
  });
  function tekstit(){
    for(const [id,a] of [["saaKaupunki","saa_kaupunki"],["saaPuoli","saa_puoli"]]){ $(id).title = T(a); $(id).setAttribute("aria-label",T(a)); }
    $("saaHakuOtsikko").textContent = T("saa_kysy"); $("saaHae").textContent = T("saa_hae");
    piirra();
  }
  puoli(store.get("saa-puoli","vasen"));
  // päivittyy itsestään puolen tunnin välein
  return {tekstit, kaynnista(){ hae(); setInterval(()=>{ if(!document.hidden) hae(); }, 30*60000); }};
})();

<script>
/* =========================================================
   ANIMAATIOT: GSAP + ScrollTrigger + SplitText + Lenis.
   React Bits -komponentit vaativat Reactin, joten niiden tehosteet on tehty
   tässä tavallisella GSAP:lla: SplitText (otsikko), AnimatedContent (sisältö), ScrollReveal (ruudut).
   Kirjastot ladataan CDN:stä defer-attribuutilla → käynnistetään DOMContentLoadedissa.
   ========================================================= */
document.addEventListener("DOMContentLoaded", ()=>{
  if(!window.gsap) return;   // CDN ei latautunut → sivu toimii ilman animaatioita
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  gsap.registerPlugin(ScrollTrigger, SplitText);

  // Lenis: pehmeä vieritys, tahdistettu ScrollTriggeriin
  if(window.Lenis){
    const lenis = new Lenis({autoRaf:false});
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add(t=>lenis.raf(t*1000));
    gsap.ticker.lagSmoothing(0);
  }

  // React Bits "SplitText": otsikon kirjaimet nousevat porrastetusti
  const h1 = document.getElementById("paaotsikko");
  document.fonts.ready.then(()=>{
    const s = SplitText.create(h1, {type:"chars"});
    gsap.from(s.chars, {yPercent:110, opacity:0, duration:.7, ease:"power3.out", stagger:.035,
      onComplete:()=>s.revert()});   // palautetaan teksti, jotta kielen vaihto toimii
  });
  gsap.from(".head > :not(h1), .cards", {opacity:0, y:12, duration:.6, ease:"power2.out", stagger:.06, delay:.2});

  // React Bits "AnimatedContent": jokainen uusi sisältö liukuu esiin
  const alkuperainen = piirraSisalto;
  piirraSisalto = function(out, item, tiivis){
    alkuperainen(out, item, tiivis);
    gsap.fromTo(out.children, {opacity:0, y:18}, {opacity:1, y:0, duration:.5, ease:"power2.out", stagger:.06, clearProps:"transform,opacity"});
  };

  // React Bits "ScrollReveal": ruudukon ruudut ilmestyvät vierittäessä
  const naytaRuudut = ()=>ScrollTrigger.batch("#ruudukko .tile:not([data-nahty])", {
    start:"top 92%",
    onEnter:els=>{ els.forEach(e=>e.dataset.nahty=""); gsap.fromTo(els, {opacity:0, y:30, scale:.98}, {opacity:1, y:0, scale:1, duration:.6, ease:"power3.out", stagger:.08, clearProps:"transform,opacity"}); }
  });
  new MutationObserver(()=>{ naytaRuudut(); ScrollTrigger.refresh(); })
    .observe(document.getElementById("ruudukko"), {childList:true});
  naytaRuudut();
});
</script>
</body>
</html>
